spring:
  application:
    name: metadata-server

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/securecloud?options=-c%20TimeZone%3DAsia%2FKolkata}"
    username: ${DB_USERNAME:securecloud}
    password: ${DB_PASSWORD:securecloud_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash
